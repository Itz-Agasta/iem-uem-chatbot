# Nginx config for the IEM-UEM kiosk: serves the built frontend (with SPA
# fallback so /admin works on direct navigation, not just client-side links)
# and reverse-proxies the backend API.
#
# Install:
#   sudo cp deploy/nginx/iem-uem.conf /etc/nginx/sites-available/iem-uem
#   sudo ln -s /etc/nginx/sites-available/iem-uem /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Build the frontend first:
#   cd frontend && npm run build
# and point the `root` directives below at the resulting dist/ folder.
#
# EDIT: server_name, root paths, and (for HTTPS) certificate paths below.

# --- Frontend: static files with SPA fallback ---------------------------------------
server {
    listen 80;
    server_name kiosk.your-college-domain.edu;   # EDIT: your real domain or server IP

    root /opt/iem-uem-chatbot/frontend/dist;      # EDIT: path to `npm run build` output
    index index.html;

    # The actual SPA fallback: if the requested path doesn't match a real
    # file (e.g. /admin, or /admin/anything), serve index.html instead of a
    # 404. React Router (or in this app's case, the simple path check in
    # main.tsx) then takes over client-side. This is what makes navigating
    # directly to /admin (typed URL, bookmark, refresh) work correctly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache built JS/CSS assets aggressively -- Vite fingerprints filenames,
    # so a new deploy gets new filenames and old cached ones are harmless.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# --- Backend: reverse proxy to the FastAPI app running on :8000 ---------------------
# Optional -- the frontend can also talk directly to the backend's own host:port
# (that's what VITE_API_BASE_URL is for). Proxying through nginx here is useful if
# you want a single public entrypoint, TLS termination, and/or nginx-level request
# size limits in front of the API.
server {
    listen 80;
    server_name api.your-college-domain.edu;   # EDIT: your real domain or server IP

    # Matches MAX_UPLOAD_SIZE_MB in backend/app/config.py -- keep these in sync
    client_max_body_size 8M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /ask can take a while for a 14B model to generate a full answer --
        # don't let nginx time out before the backend responds.
        proxy_read_timeout 120s;
    }

    # Don't expose /metrics to the public internet -- Prometheus should
    # scrape it directly on the backend's own port (see deploy/monitoring/),
    # not through this public-facing proxy.
    location /metrics {
        deny all;
        return 404;
    }
}

# --- HTTPS (recommended before any real deployment) ----------------------------------
# Once you have a domain name and a certificate (e.g. via Let's Encrypt / certbot,
# or a self-signed cert for an internal-only LAN), add a block like this and redirect
# the plain-HTTP server blocks above to it:
#
# server {
#     listen 443 ssl http2;
#     server_name kiosk.your-college-domain.edu;
#
#     ssl_certificate     /etc/letsencrypt/live/kiosk.your-college-domain.edu/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/kiosk.your-college-domain.edu/privkey.pem;
#
#     root /opt/iem-uem-chatbot/frontend/dist;
#     index index.html;
#     location / {
#         try_files $uri $uri/ /index.html;
#     }
# }
#
# For an internal-only LAN with no public domain, certbot's DNS/HTTP challenges
# won't work -- generate a self-signed cert instead:
#   sudo openssl req -x509 -nodes -days 825 -newkey rsa:2048 \
#     -keyout /etc/ssl/private/iem-uem-selfsigned.key \
#     -out /etc/ssl/certs/iem-uem-selfsigned.crt
# Browsers will show a "not secure" warning for self-signed certs on first visit --
# expected for an internal kiosk, but worth knowing.
